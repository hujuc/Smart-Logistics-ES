services:
  # Apache Zookeeper - Coordination service for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: slms-zookeeper-prod
    environment:
      ZOOKEEPER_CLIENT_PORT: ${KAFKA_ZOOKEEPER_PORT:-2181}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${KAFKA_ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zookeeper-data:/bitnami/zookeeper
    restart: unless-stopped
    networks:
      - slms-network

  # Apache Kafka - Event streaming platform
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: slms-kafka-prod
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_HOST:-zookeeper}:${KAFKA_ZOOKEEPER_PORT:-2181}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:${KAFKA_BROKER_EXTERNAL_PORT:-9094}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_BROKER_HOST:-kafka}:${KAFKA_BROKER_PORT:-9092},EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_BROKER_EXTERNAL_PORT:-9094}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_BROKER_PORT:-9092}:9092"
      - "${KAFKA_BROKER_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/bitnami/kafka
    restart: unless-stopped
    networks:
      - slms-network

  # Keycloak - External authentication service
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak-prod
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://slms-postgres-prod:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-http://ec2-51-44-208-160.eu-west-3.compute.amazonaws.com:8180}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_BACKCHANNEL: ${KC_HOSTNAME_STRICT_BACKCHANNEL:-false}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_PROXY: ${KC_PROXY:-edge}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - slms-network

  # MinIO - Object storage service
  minio:
    image: minio/minio:latest
    container_name: slms-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - slms-network

  # MinIO bucket creation
  minio-create-bucket:
    image: minio/mc:latest
    container_name: slms-minio-create-bucket-prod
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://slms-minio-prod:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Aguardando o MinIO ficar disponivel...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME};
      "
    restart: "no"

  orchestrator:
    build:
      context: ..
      dockerfile: infra/docker/orchestrator/Dockerfile
    container_name: slms-orchestrator-prod
    environment:
      - API_BASE_URL=http://slms-backend-prod:8080/api
      - ORCHESTRATOR_INTERVAL=600
    restart: unless-stopped
    networks:
      - slms-network

  # Nginx - Reverse proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - slms-network

volumes:
  keycloak-data:
  minio-data:
  kafka-data:
  zookeeper-data:

networks:
  slms-network:
    external: true
    name: slms-network
