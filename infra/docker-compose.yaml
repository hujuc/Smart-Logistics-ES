services:
  # Keycloak - External authentication service
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak-prod
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://slms-postgres-prod:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-http://ec2-35-181-9-117.eu-west-3.compute.amazonaws.com:8180}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_BACKCHANNEL: ${KC_HOSTNAME_STRICT_BACKCHANNEL:-false}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_PROXY: ${KC_PROXY:-edge}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - slms-network

  # MinIO - Object storage service
  minio:
    image: minio/minio:latest
    container_name: slms-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - slms-network

  # MinIO bucket creation
  minio-create-bucket:
    image: minio/mc:latest
    container_name: slms-minio-create-bucket-prod
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://slms-minio-prod:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Aguardando o MinIO ficar disponivel...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME};
      "
    restart: "no"
    networks:
      - slms-network

  backup:
    build:
      context: ..
      dockerfile: infra/docker/backup/Dockerfile
    container_name: slms-backup-prod
    env_file:
      - .env
    environment:
      POSTGRES_HOST: slms-postgres-prod
      POSTGRES_PORT: ${POSTGRES_PORT}
      BACKUP_DIR: /backups
      MAX_BACKUPS: ${MAX_BACKUPS:-4}
    volumes:
      - backup-data:/backups
    restart: unless-stopped
    networks:
      - slms-network

  # Nginx - Reverse proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - slms-network

volumes:
  keycloak-data:
  minio-data:
  backup-data:

networks:
  slms-network:
    external: true
    name: slms-network
