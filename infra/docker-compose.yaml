services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
    command: start --import-realm
    depends_on:
      - postgres
    expose:
      - "8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: slms-backend
    depends_on:
      - postgres
      - keycloak
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    expose:
      - "${BACKEND_PORT}"

  admin-console:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/admin-console
    container_name: slms-admin-console
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  costumer-portal:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/costumer-portal
    container_name: slms-costumer-portal
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  driver-pwa:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/driver-pwa
    container_name: slms-driver-pwa
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  landing-page:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/landing-page
    container_name: slms-landing-page
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx
    depends_on:
      - backend
      - admin-console
      - costumer-portal
      - driver-pwa
      - landing-page
      - keycloak
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  keycloak-data:
  minio-data:
