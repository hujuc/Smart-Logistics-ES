version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slms
      POSTGRES_USER: slms
      POSTGRES_PASSWORD: slms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: