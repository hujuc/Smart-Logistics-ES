services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_PROXY: ${KC_PROXY}
    command: start --import-realm
    depends_on:
      - postgres
    expose:
      - "8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: slms-backend
    depends_on:
      - postgres
      - keycloak
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    expose:
      - "${BACKEND_PORT}"

  admin-console:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/admin-console
    container_name: slms-admin-console
    environment:
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}
      NODE_ENV: ${NODE_ENV}
    restart: unless-stopped
    expose:
      - "3000"

  costumer-portal:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/costumer-portal
    container_name: slms-costumer-portal
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    expose:
      - "3000"

  driver-pwa:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/driver-pwa
    container_name: slms-driver-pwa
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    expose:
      - "3000"

  landing-page:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/landing-page
    container_name: slms-landing-page
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx
    depends_on:
      - backend
      - admin-console
      - costumer-portal
      - driver-pwa
      - landing-page
      - keycloak
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  keycloak-data:
