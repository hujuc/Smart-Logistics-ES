services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak
    restart: unless-stopped
    env_file:
      - .env
    command: start --import-realm
    depends_on:
      - postgres
    expose:
      - "8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: slms-backend
    depends_on:
      - postgres
      - keycloak
    env_file:
      - .env
    expose:
      - "${BACKEND_PORT}"

  admin-console:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/admin-console
    container_name: slms-admin-console
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  costumer-portal:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/costumer-portal
    container_name: slms-costumer-portal
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  driver-pwa:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/driver-pwa
    container_name: slms-driver-pwa
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  landing-page:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        FRONTEND_PATH: src/frontend/landing-page
    container_name: slms-landing-page
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx
    depends_on:
      - backend
      - admin-console
      - costumer-portal
      - driver-pwa
      - landing-page
      - keycloak
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  keycloak-data:
