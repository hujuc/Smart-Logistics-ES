services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slms
      POSTGRES_USER: slms
      POSTGRES_PASSWORD: slms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: slms-dev-backend
    depends_on:
      - postgres
    env_file:
      - ../src/backend/.env
    working_dir: /workspace
    command: ./mvnw spring-boot:run
    ports:
      - "8080:8080"
    volumes:
      - ../src/backend:/workspace
      - maven-cache:/root/.m2

  admin-console:
    image: node:20
    container_name: slms-dev-admin-console
    depends_on:
      - backend
    working_dir: /app
    command: sh -c "rm -rf node_modules/.next-* && npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    volumes:
      - ../src/frontend/admin-console:/app
      - admin_console_node_modules:/app/node_modules

  costumer-portal:
    image: node:20
    container_name: slms-dev-costumer-portal
    depends_on:
      - backend
    working_dir: /app
    command: sh -c "rm -rf node_modules/.next-* && npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    volumes:
      - ../src/frontend/costumer-portal:/app
      - costumer_portal_node_modules:/app/node_modules

  driver-pwa:
    image: node:20
    container_name: slms-dev-driver-pwa
    depends_on:
      - backend
    working_dir: /app
    command: sh -c "rm -rf node_modules/.next-* && npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    volumes:
      - ../src/frontend/driver-pwa:/app
      - driver_pwa_node_modules:/app/node_modules

  nginx:
    image: nginx:1.25-alpine
    container_name: slms-dev-nginx
    depends_on:
      - admin-console
      - costumer-portal
      - driver-pwa
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  maven-cache:
  admin_console_node_modules:
  costumer_portal_node_modules:
  driver_pwa_node_modules:
