services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slms
      POSTGRES_USER: slms
      POSTGRES_PASSWORD: slms
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak-dev
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/slms
      KC_DB_USERNAME: slms
      KC_DB_PASSWORD: slms  
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    depends_on:
      - postgres
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    container_name: slms-backend-dev
    depends_on:
      - postgres
      - keycloak
      - minio
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/slms
      SPRING_DATASOURCE_USERNAME: slms
      SPRING_DATASOURCE_PASSWORD: slms
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminsecret
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminsecret
      MINIO_BUCKET: slms-documents
    volumes:
      - ../src/backend:/app
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run  
    expose:
      - "8080"

  admin-console:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/admin-console
    container_name: slms-admin-console-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/admin-console:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  costumer-portal:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/costumer-portal
    container_name: slms-costumer-portal-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/costumer-portal:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  driver-pwa:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/driver-pwa
    container_name: slms-driver-pwa-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/driver-pwa:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  landing-page:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/landing-page
    container_name: slms-landing-page-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/landing-page:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx-dev
    depends_on:
      - backend
      - admin-console
      - costumer-portal
      - driver-pwa
      - landing-page
      - keycloak
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminsecret
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Console web
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:  
  postgres-data:
  minio_data:
  keycloak-data:
