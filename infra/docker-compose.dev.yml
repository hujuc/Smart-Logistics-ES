services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED}
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    depends_on:
      - postgres
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    container_name: slms-backend-dev
    depends_on:
      - postgres
      - keycloak
      - minio
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      AWS_S3_ENDPOINT: http://${MINIO_HOST}:${MINIO_PORT}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ../src/backend:/app
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run  
    expose:
      - "8080"

  admin-console:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/admin-console
    container_name: slms-admin-console-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/admin-console:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  costumer-portal:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/costumer-portal
    container_name: slms-costumer-portal-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/costumer-portal:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  driver-pwa:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/driver-pwa
    container_name: slms-driver-pwa-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/driver-pwa:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  landing-page:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/landing-page
    container_name: slms-landing-page-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/landing-page:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx-dev
    depends_on:
      - backend
      - admin-console
      - costumer-portal
      - driver-pwa
      - landing-page
      - keycloak
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Console web
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-create-bucket
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Aguardando o MinIO ficar disponivel...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/${MINIO_BUCKET};
      "
    restart: "no"

volumes:  
  postgres-data:
  minio_data:
  keycloak-data:
