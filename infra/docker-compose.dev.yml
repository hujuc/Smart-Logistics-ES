services:
  postgres:
    image: postgres:16-alpine
    container_name: slms-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: slms-keycloak-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile.dev
    container_name: slms-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL}
      - ELASTIC_APM_SECRET_TOKEN=${ELASTIC_APM_SECRET_TOKEN}
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV}
      - PROJECT_VERSION=${PROJECT_VERSION}
      - TRACING_SAMPLING_RATE=${TRACING_SAMPLING_RATE}
      # OpenTelemetry SDK native environment variables
      - OTEL_EXPORTER_OTLP_ENDPOINT=${ELASTIC_APM_SERVER_URL}
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer ${ELASTIC_APM_SECRET_TOKEN}
      - OTEL_SERVICE_NAME=SLMS
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=${DEPLOYMENT_ENV},service.version=${PROJECT_VERSION}
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=${TRACING_SAMPLING_RATE}
    volumes:
      - ../src/backend:/app
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  admin-console:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/admin-console
    container_name: slms-admin-console-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/admin-console:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  customer-portal:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/customer-portal
    container_name: slms-customer-portal-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Flagsmith Configuration
      NEXT_PUBLIC_FLAGSMITH_ENV_KEY: ${NEXT_PUBLIC_FLAGSMITH_ENV_KEY}
    working_dir: /app
    volumes:
      - ../src/frontend/customer-portal:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  driver-pwa:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/driver-pwa
    container_name: slms-driver-pwa-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Mapbox Configuration
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
    working_dir: /app
    volumes:
      - ../src/frontend/driver-pwa:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  landing-page:
    build:
      context: ..
      dockerfile: infra/docker/frontend/Dockerfile.dev
      args:
        FRONTEND_PATH: src/frontend/landing-page
    container_name: slms-landing-page-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ../src/frontend/landing-page:/app
      - /app/node_modules
    command: npm run dev
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: slms-nginx-dev
    depends_on:
      - backend
      - admin-console
      - customer-portal
      - driver-pwa
      - landing-page
      - keycloak
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Console web
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-create-bucket
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Aguardando o MinIO ficar disponivel...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/${MINIO_BUCKET};
      "
    restart: "no"

volumes:  
  postgres-data:
  minio_data:
  keycloak-data:
