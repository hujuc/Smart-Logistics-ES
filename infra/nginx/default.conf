map $http_upgrade $connection_upgrade {
  default upgrade;
  '' keep-alive;
}

upstream backend_upstream {
  least_conn;
  server slms-backend-prod-1:8080;
  server slms-backend-prod-2:8080;
}

upstream admin_console_upstream {
  least_conn;
  server slms-admin-console-prod-1:3000;
  server slms-admin-console-prod-2:3000;
}

upstream customer_portal_upstream {
  least_conn;
  server slms-customer-portal-prod-1:3000;
  server slms-customer-portal-prod-2:3000;
}

upstream driver_pwa_upstream {
  least_conn;
  server slms-driver-pwa-prod-1:3000;
  server slms-driver-pwa-prod-2:3000;
}

upstream landing_page_upstream {
  least_conn;
  server slms-landing-page-prod-1:3000;
  server slms-landing-page-prod-2:3000;
}

server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_http_version 1.1;
  proxy_buffering off;

  # ACTUATOR - Spring Boot Actuator endpoints (health, metrics, prometheus)
  location /actuator/ { proxy_pass http://backend_upstream; }

  # API
  # NextAuth specific routes go to admin-console with path rewrite
  location ~ ^/api/auth/(signin|signout|callback|csrf|session|providers|error).*$ {
    rewrite ^/api/auth/(.*)$ /admin/api/auth/$1 break;
    proxy_pass http://admin_console_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }
  location /api/ { proxy_pass http://backend_upstream; }

  # AUTH - Keycloak 26.0+ paths
  location = /auth { proxy_pass http://slms-keycloak-prod:8080/; }
  location ^~ /auth/ { proxy_pass http://slms-keycloak-prod:8080/; }
  location ^~ /realms/ { proxy_pass http://slms-keycloak-prod:8080/realms/; }
  location ^~ /resources/ { proxy_pass http://slms-keycloak-prod:8080/resources/; }
  location ^~ /js/ { proxy_pass http://slms-keycloak-prod:8080/js/; }

  # ADMIN - Keycloak Admin Console (must come before Next.js /admin)
  location ^~ /admin/master/ { proxy_pass http://slms-keycloak-prod:8080/admin/master/; }
  location ^~ /admin/realms/ { proxy_pass http://slms-keycloak-prod:8080/admin/realms/; }
  location ^~ /admin/serverinfo { proxy_pass http://slms-keycloak-prod:8080/admin/serverinfo; }

  # ADMIN - Next.js Admin Console (produção com basePath)
  location ^~ /admin/ { 
    proxy_pass http://admin_console_upstream; 
  }

  # CUSTOMER (produção com basePath)
  location ^~ /customer/ { 
    proxy_pass http://customer_portal_upstream; 
  }

  # DRIVER (produção com basePath)
  location ^~ /driver/ { 
    proxy_pass http://driver_pwa_upstream; 
  }

  # LANDING PAGE
  location / { proxy_pass http://landing_page_upstream; }
}
