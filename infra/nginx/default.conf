map $http_upgrade $connection_upgrade {
  default upgrade;
  '' keep-alive;
}

server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_http_version 1.1;
  proxy_buffering off;

  # ACTUATOR - Spring Boot Actuator endpoints (health, metrics, prometheus)
  location /actuator/ { proxy_pass http://backend:8080; }

  # API
  # NextAuth specific routes go to admin-console with path rewrite
  location ~ ^/api/auth/(signin|signout|callback|csrf|session|providers|error).*$ {
    rewrite ^/api/auth/(.*)$ /admin/api/auth/$1 break;
    proxy_pass http://admin-console:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # All other /api/ routes (including /api/landing-page/auth/login) go to backend
  location /api/ { proxy_pass http://backend:8080; }

  # AUTH - Keycloak 26.0+ paths
  location = /auth { proxy_pass http://keycloak:8080/; }
  location ^~ /auth/ { proxy_pass http://keycloak:8080/; }
  location ^~ /realms/ { proxy_pass http://keycloak:8080/realms/; }
  location ^~ /resources/ { proxy_pass http://keycloak:8080/resources/; }
  location ^~ /js/ { proxy_pass http://keycloak:8080/js/; }

  # ADMIN - Keycloak Admin Console (must come before Next.js /admin)
  location ^~ /admin/master/ { proxy_pass http://keycloak:8080/admin/master/; }
  location ^~ /admin/realms/ { proxy_pass http://keycloak:8080/admin/realms/; }
  location ^~ /admin/serverinfo { proxy_pass http://keycloak:8080/admin/serverinfo; }

  # ADMIN - Next.js Admin Console
  location = /admin { proxy_pass http://admin-console:3000; }
  location ^~ /admin/ { proxy_pass http://admin-console:3000; }

  # CUSTOMER
  location = /customer { proxy_pass http://customer-portal:3000; }
  location ^~ /customer/ { proxy_pass http://customer-portal:3000; }

  # DRIVER
  location = /driver { proxy_pass http://driver-pwa:3000; }
  location ^~ /driver/ { proxy_pass http://driver-pwa:3000; }

  # LANDING PAGE
  location / { proxy_pass http://landing-page:3000; }
}
