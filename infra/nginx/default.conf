server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ADMIN
  location = /admin { proxy_pass http://admin-console:3000; }
  location ^~ /admin/ { proxy_pass http://admin-console:3000; }

  # CUSTOMER
  location = /customer { proxy_pass http://costumer-portal:3000; }
  location ^~ /customer/ { proxy_pass http://costumer-portal:3000; }

  # DRIVER
  location = /driver { proxy_pass http://driver-pwa:3000; }
  location ^~ /driver/ { proxy_pass http://driver-pwa:3000; }

  location / { return 404; }
}
