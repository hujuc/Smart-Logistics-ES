map $http_upgrade $connection_upgrade {
  default upgrade;
  '' keep-alive;
}

server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_http_version 1.1;
  proxy_buffering off;

  # API 
  # NextAuth specific routes go to admin-console with path rewrite
  location ~ ^/api/auth/(signin|signout|callback|csrf|session|providers|error).*$ {
    rewrite ^/api/auth/(.*)$ /admin/api/auth/$1 break;
    proxy_pass http://slms-admin-console-dev:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }
  location /api/ { proxy_pass http://slms-backend-dev:8080; }

  # AUTH - Keycloak 26.0+ paths
  location = /auth { proxy_pass http://slms-keycloak-dev:8080/; }
  location ^~ /auth/ { proxy_pass http://slms-keycloak-dev:8080/; }
  location ^~ /realms/ { proxy_pass http://slms-keycloak-dev:8080/realms/; }
  location ^~ /resources/ { proxy_pass http://slms-keycloak-dev:8080/resources/; }
  location ^~ /js/ { proxy_pass http://slms-keycloak-dev:8080/js/; }

  # ADMIN - Keycloak Admin Console (must come before Next.js /admin)
  location ^~ /admin/master/ { proxy_pass http://slms-keycloak-dev:8080/admin/master/; }
  location ^~ /admin/realms/ { proxy_pass http://slms-keycloak-dev:8080/admin/realms/; }
  location ^~ /admin/serverinfo { proxy_pass http://slms-keycloak-dev:8080/admin/serverinfo; }

  # ADMIN - Next.js Admin Console (development)
  location ^~ /admin/ { 
    proxy_pass http://slms-admin-console-dev:3000; 
  }

  # CUSTOMER (development)
  location ^~ /customer/ { 
    proxy_pass http://slms-customer-portal-dev:3000; 
  }

  # DRIVER (development)
  location ^~ /driver/ { 
    proxy_pass http://slms-driver-pwa-dev:3000; 
  }

  # LANDING PAGE
  location / { proxy_pass http://slms-landing-page-dev:3000; }
}
