spring.application.name=SLMS

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MINIO
aws.s3.endpoint=http://${MINIO_HOST}:${MINIO_PORT}
aws.s3.accessKey=${MINIO_ROOT_USER}
aws.s3.secretKey=${MINIO_ROOT_PASSWORD}
aws.s3.bucket=${MINIO_BUCKET}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:slms-consumers}
spring.kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Topics
kafka.topic.order-events=order-events
kafka.topic.shipment-events=shipment-events

# Order QR confirmation
slms.qr.confirmation-base-url=${QR_CONFIRMATION_BASE_URL:http://localhost:8080/api/driver}

# Keycloak OAuth2 Resource Server
# issuer-uri: Defaults to the internal Keycloak realm when JWT_ISSUER_URI is not provided (e.g., local Docker)
# jwk-set-uri: Uses internal Docker network hostname for fetching public keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak.auth-server-url=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Carrier Integrations
integrations.shippo.base-url=${SHIPPO_BASE_URL:https://api.goshippo.com}
integrations.shippo.api-key=${SHIPPO_API_KEY:}
integrations.shipengine.base-url=${SHIPENGINE_BASE_URL:https://api.shipengine.com/v1}
integrations.shipengine.api-key=${SHIPENGINE_API_KEY:${SANDBOX_API_KEY:}}

# Elastic APM Configuration
elastic.apm.server-url=${ELASTIC_APM_SERVER_URL:}
elastic.apm.secret-token=${ELASTIC_APM_SECRET_TOKEN:}
elastic.apm.service-name=${spring.application.name}
elastic.apm.environment=${DEPLOYMENT_ENV:development}
elastic.apm.application-packages=Operimus.SLMS
elastic.apm.enabled=false
elastic.apm.log-level=ERROR

# ============================================
# OBSERVABILITY - Elastic APM via Java Agent
# ============================================
# Note: Elastic APM Java Agent handles all tracing automatically
# We don't need Spring Boot's native OpenTelemetry OTLP export
# The agent uses its own protocol to communicate with Elastic APM

# Tracing Sampling (1.0 = 100% for development, tune for production)
management.tracing.sampling.probability=${TRACING_SAMPLING_RATE:1.0}

# Spring Boot Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Metrics Export
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.Operimus.SLMS=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Chatbot Module - Gemini AI API configuration
chatbot.gemini.api-key=${GEMINI_API_KEY:}
chatbot.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
chatbot.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# Chatbot Module - Pinecone Vector DB
chatbot.pinecone.api-key=${PINECONE_API_KEY:}
chatbot.pinecone.host=${PINECONE_HOST:}
chatbot.pinecone.index=${PINECONE_INDEX:slms-chatbot}
chatbot.pinecone.namespace=${PINECONE_NAMESPACE:en-US}

# Chatbot Module - Document Seeding
# Enable automatic seeding of knowledge base documents on startup (development only)
chatbot.seeder.enabled=${CHATBOT_SEEDER_ENABLED:false}

# Chatbot Health Indicators
# Can be disabled in CI/test environments to avoid failures with dummy credentials
management.health.gemini.enabled=${HEALTH_GEMINI_ENABLED:true}
management.health.pinecone.enabled=${HEALTH_PINECONE_ENABLED:true}
