spring.application.name=SLMS

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slms}
spring.datasource.username=${DB_USERNAME:slms}
spring.datasource.password=${DB_PASSWORD:slms}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Keycloak OAuth2 Resource Server
# issuer-uri must match token issuer (localhost for users accessing via browser/Postman)
# but we use jwk-set-uri with nginx so backend can fetch keys internally
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/realms/${KEYCLOAK_REALM:slms}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://nginx/realms/${KEYCLOAK_REALM:slms}/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak.auth-server-url=http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}
keycloak.realm=${KEYCLOAK_REALM:slms}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:slms-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}