spring.application.name=SLMS

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slms}
spring.datasource.username=${DB_USERNAME:slms}
spring.datasource.password=${DB_PASSWORD:slms}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}


# MINIO
aws.s3.endpoint=http://${MINIO_HOST}:${MINIO_PORT}
aws.s3.accessKey=${MINIO_ROOT_USER:minioadmin}
aws.s3.secretKey=${MINIO_ROOT_PASSWORD:minioadminsecret}
aws.s3.bucket=${MINIO_BUCKET:documents}
# Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:slms}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:slms}/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak.auth-server-url=http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}
keycloak.realm=${KEYCLOAK_REALM:slms}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:slms-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
