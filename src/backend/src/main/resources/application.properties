spring.application.name=SLMS

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MINIO
aws.s3.endpoint=http://${MINIO_HOST}:${MINIO_PORT}
aws.s3.accessKey=${MINIO_ROOT_USER}
aws.s3.secretKey=${MINIO_ROOT_PASSWORD}
aws.s3.bucket=${MINIO_BUCKET}

# Keycloak OAuth2 Resource Server
# issuer-uri: Defaults to the internal Keycloak realm when JWT_ISSUER_URI is not provided (e.g., local Docker)
# jwk-set-uri: Uses internal Docker network hostname for fetching public keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak.auth-server-url=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Carrier Integrations
integrations.shippo.base-url=${SHIPPO_BASE_URL:https://api.goshippo.com}
integrations.shippo.api-key=${SHIPPO_API_KEY:}
integrations.shipengine.base-url=${SHIPENGINE_BASE_URL:https://api.shipengine.com/v1}
integrations.shipengine.api-key=${SHIPENGINE_API_KEY:${SANDBOX_API_KEY:}}

# ============================================
# OBSERVABILITY - OpenTelemetry & Elastic APM
# ============================================

# OpenTelemetry Service Configuration
management.opentelemetry.resource-attributes."service.name"=${spring.application.name}
management.opentelemetry.resource-attributes."deployment.environment"=${DEPLOYMENT_ENV:development}
management.opentelemetry.resource-attributes."service.version"=${PROJECT_VERSION:0.0.1-SNAPSHOT}

# OpenTelemetry Tracing - OTLP Export to Elastic APM
management.otlp.tracing.endpoint=${ELASTIC_APM_SERVER_URL}/v1/traces
management.otlp.tracing.timeout=10s
management.otlp.tracing.compression=gzip
management.otlp.tracing.headers.Authorization=Bearer ${ELASTIC_APM_SECRET_TOKEN}

# Tracing Sampling (1.0 = 100% for development, tune for production)
management.tracing.sampling.probability=${TRACING_SAMPLING_RATE:1.0}

# OpenTelemetry Metrics - OTLP Export to Elastic APM
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${ELASTIC_APM_SERVER_URL}/v1/metrics
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.compression=gzip
management.otlp.metrics.export.headers.Authorization=Bearer ${ELASTIC_APM_SECRET_TOKEN}

# Spring Boot Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Metrics Export
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.Operimus.SLMS=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
