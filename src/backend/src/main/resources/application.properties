spring.application.name=SLMS

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MINIO
aws.s3.endpoint=http://${MINIO_HOST}:${MINIO_PORT}
aws.s3.accessKey=${MINIO_ROOT_USER}
aws.s3.secretKey=${MINIO_ROOT_PASSWORD}
aws.s3.bucket=${MINIO_BUCKET}

# Keycloak OAuth2 Resource Server
# Para desenvolvimento local, use localhost:8180 para ambos
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/${KEYCLOAK_REALM:slms}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/${KEYCLOAK_REALM:slms}/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak.auth-server-url=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Carrier Integrations
integrations.shippo.base-url=${SHIPPO_BASE_URL:https://api.goshippo.com}
integrations.shippo.api-key=${SHIPPO_API_KEY:}
integrations.shipengine.base-url=${SHIPENGINE_BASE_URL:https://api.shipengine.com/v1}
integrations.shipengine.api-key=${SHIPENGINE_API_KEY:${SANDBOX_API_KEY:}}

# Disable security for development (REMOVE IN PRODUCTION)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
