spring.application.name=SLMS

# PostgreSQL datasource configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slms}
spring.datasource.username=${DB_USERNAME:slms}
spring.datasource.password=${DB_PASSWORD:slms}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}


# MINIO
aws.s3.endpoint=http://localhost:9000
aws.s3.accessKey=minioadmin
aws.s3.secretKey=minioadminsecret
aws.s3.bucket=documents
