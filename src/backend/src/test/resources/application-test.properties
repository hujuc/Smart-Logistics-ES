# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MinIO/S3 Configuration for tests
# Default values allow unit tests to load ApplicationContext
# Integration tests can override via environment variables
aws.s3.endpoint=http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
aws.s3.accessKey=${MINIO_ROOT_USER:minioadmin}
aws.s3.secretKey=${MINIO_ROOT_PASSWORD:minioadminsecret}
aws.s3.bucket=${MINIO_BUCKET:test-bucket}

# Disable Keycloak OAuth2 for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Keycloak Admin Client
# Default values allow unit tests to load ApplicationContext
# For integration tests: override via environment variables
# For unit tests: these services are mocked by TestSecurityConfig
keycloak.auth-server-url=http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}
keycloak.realm=${KEYCLOAK_REALM:slms}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:slms-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-secret-change-in-production}
