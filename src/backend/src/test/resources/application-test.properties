# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MinIO/S3 Configuration for tests
aws.s3.endpoint=http://${MINIO_HOST}:${MINIO_PORT}
aws.s3.accessKey=${MINIO_ROOT_USER}
aws.s3.secretKey=${MINIO_ROOT_PASSWORD}
aws.s3.bucket=${MINIO_BUCKET}

# Disable Keycloak OAuth2 for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Keycloak Admin Client
# For integration tests: uses .env values
# For unit tests: these values are not used (mocked by TestSecurityConfig)
keycloak.auth-server-url=http://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
