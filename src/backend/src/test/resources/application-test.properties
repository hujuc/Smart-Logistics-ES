# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MinIO/S3 Configuration for tests
# Default values allow unit tests to load ApplicationContext
# Integration tests can override via environment variables
aws.s3.endpoint=http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
aws.s3.accessKey=${MINIO_ROOT_USER:minioadmin}
aws.s3.secretKey=${MINIO_ROOT_PASSWORD:minioadminsecret}
aws.s3.bucket=${MINIO_BUCKET:test-bucket}

# Keycloak OAuth2 for tests - use dummy values to prevent autoconfiguration errors
# The TestSecurityConfig will provide a mock JwtDecoder that overrides these
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/test/protocol/openid-connect/certs

# Keycloak Admin Client
# Default values allow unit tests to load ApplicationContext
# For integration tests: override via environment variables
# For unit tests: these services are mocked by TestSecurityConfig
keycloak.auth-server-url=http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}
keycloak.realm=${KEYCLOAK_REALM:slms}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:slms-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:dev-secret-change-in-production}

# Chatbot Module - Gemini AI
# Dummy values for tests - clients will be mocked in integration tests
chatbot.gemini.api-key=${GEMINI_API_KEY:test-gemini-api-key-for-tests}
chatbot.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
chatbot.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# Chatbot Module - Pinecone Vector DB
# Dummy values for tests - clients will be mocked in integration tests
chatbot.pinecone.api-key=${PINECONE_API_KEY:test-pinecone-api-key-for-tests}
chatbot.pinecone.host=${PINECONE_HOST:https://test-index.svc.pinecone.io}
chatbot.pinecone.index=${PINECONE_INDEX:test-index}
chatbot.pinecone.namespace=${PINECONE_NAMESPACE:test-namespace}

# Disable document seeding in tests
chatbot.seeder.enabled=false

# QR Code Confirmation
slms.qr.confirmation-base-url=${QR_CONFIRMATION_BASE_URL:http://localhost:8080/api/driver}

# Disable observability/tracing for tests
management.tracing.enabled=false
management.metrics.export.prometheus.enabled=false

# Kafka Configuration for tests
# Default values allow unit tests to load ApplicationContext
# Integration tests can override via environment variables
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:slms-test-consumers}
spring.kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Disable Kafka health check for unit tests (prevents 503 errors)
# Integration tests will have Kafka running, so it's fine
management.health.kafka.enabled=false
