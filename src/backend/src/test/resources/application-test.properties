# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# MinIO/S3 Configuration for tests
aws.s3.endpoint=http://localhost:9000
aws.s3.accessKey=minioadmin
aws.s3.secretKey=minioadminsecret
aws.s3.bucket=test-documents

# Disable Keycloak OAuth2 for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# Keycloak Admin Client (for mocked tests)
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=slms
keycloak.admin.client-id=slms-backend
keycloak.admin.client-secret=test-secret
