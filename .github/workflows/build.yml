name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Build & Test (with JaCoCo gate)
        id: build
        run: mvn -B -ntp -DskipTests=false -Dtest='!**/*IntegrationTest' clean verify

      - name: Upload JaCoCo HTML (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: src/backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Post PR Coverage Gate (always)
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ${{ steps.build.outcome == 'success'
              && '✅ Quality gate met.'
              || '❌ Quality gate not met (JaCoCo coverage below required threshold).' }}

            _See the uploaded **jacoco-report** artifact for details._

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "❌ Quality Gate failed (JaCoCo threshold not reached or build failed)."
            exit 1
          else
            echo " ✅ Quality Gate passed."
          fi

  frontend-quality:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin-console
          - costumer-portal
          - driver-pwa
    env:
      CI: true
    defaults:
      run:
        working-directory: src/frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build health check
        run: npm run build

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-quality
    env:
      KEYCLOAK_HOST: localhost
      KEYCLOAK_PORT: "8180"
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
      MINIO_HOST: localhost
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Start integration dependencies
        working-directory: ${{ github.workspace }}
        run: docker compose -f infra/docker-compose.dev.yml up -d postgres keycloak minio minio-create-bucket

      - name: Wait for Keycloak readiness
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..30}; do
            if curl -sSf http://localhost:8180/health/ready > /dev/null; then
              echo "Keycloak is ready."
              exit 0
            fi
            echo "Waiting for Keycloak... (attempt ${attempt})"
            sleep 5
          done
          echo "Keycloak did not become ready in time."
          docker compose -f infra/docker-compose.dev.yml logs keycloak
          exit 1

      - name: Wait for MinIO readiness
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..30}; do
            if curl -sSf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready."
              exit 0
            fi
            echo "Waiting for MinIO... (attempt ${attempt})"
            sleep 5
          done
          echo "MinIO did not become ready in time."
          docker compose -f infra/docker-compose.dev.yml logs minio
          exit 1

      - name: Run integration tests
        working-directory: src/backend
        run: mvn -B -ntp -DskipTests=false -Dtest='*IntegrationTest' test

      - name: Stop integration dependencies
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f infra/docker-compose.dev.yml down -v
