name: CI

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Build & Test (with JaCoCo gate)
        id: build
        run: mvn -B -ntp -DskipTests=false clean verify
        continue-on-error: true

      - name: Upload JaCoCo HTML (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: src/backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Post PR Coverage Gate (fail only)
        if: ${{ github.event_name == 'pull_request' && steps.build.outcome != 'success' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ❌ Quality gate not met (JaCoCo coverage below required threshold).
            _See the uploaded **jacoco-report** artifact for details._

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "❌ Quality Gate failed (JaCoCo threshold not reached or build failed)."
            exit 1
          else
            echo " ✅ Quality Gate passed."
          fi
