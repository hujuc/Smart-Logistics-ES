name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Build & Test (with JaCoCo gate)
        id: build
        run: mvn -B -ntp -DskipTests=false -Dtest='!**/*IntegrationTest' clean verify

      - name: Upload JaCoCo HTML (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: src/backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Post PR Coverage Gate (always)
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ${{ steps.build.outcome == 'success'
              && '✅ Quality gate met.'
              || '❌ Quality gate not met (JaCoCo coverage below required threshold).' }}

            _See the uploaded **jacoco-report** artifact for details._

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "❌ Quality Gate failed (JaCoCo threshold not reached or build failed)."
            exit 1
          else
            echo " ✅ Quality Gate passed."
          fi

  frontend-quality:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin-console
          - costumer-portal
          - driver-pwa
    env:
      CI: true
    defaults:
      run:
        working-directory: src/frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build health check
        run: npm run build
