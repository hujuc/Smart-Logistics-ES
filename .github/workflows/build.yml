name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: [self-hosted, slms]
    env:
      KEYCLOAK_HOST: ${{ secrets.KEYCLOAK_HOST }}
      KEYCLOAK_PORT: '28180'
      JWT_ISSUER_URI: http://localhost:28180/realms/slms
      MINIO_HOST: ${{ secrets.MINIO_HOST }}
      MINIO_PORT: '39000'
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Build & Test (with JaCoCo gate)
        id: build
        run: mvn -B -ntp -DskipTests=false -Dtest='!**/*IntegrationTest' clean verify

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d target/allure-results ] && [ "$(ls -A target/allure-results)" ]; then
            mvn -B -ntp allure:report
          else
            echo "No Allure results found; skipping HTML report generation."
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: src/backend/target/allure-results
          if-no-files-found: ignore

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: src/backend/target/site/allure-maven
          if-no-files-found: ignore

      - name: Publish backend JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: src/backend/target/surefire-reports/*.xml
          check_name: Backend Tests
          detailed_summary: true
          fail_on_failure: false

      - name: Upload JaCoCo HTML (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: src/backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Post PR Coverage Gate (always)
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ${{ steps.build.outcome == 'success'
              && '✅ Quality gate met.'
              || '❌ Quality gate not met (JaCoCo coverage below required threshold).' }}

            _See the uploaded **jacoco-report** artifact for details._

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "❌ Quality Gate failed (JaCoCo threshold not reached or build failed)."
            exit 1
          else
            echo " ✅ Quality Gate passed."
          fi

  frontend-quality:
    name: Frontend (${{ matrix.app }})
    runs-on: [self-hosted, slms]
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin-console
          - customer-portal
          - driver-pwa
          - landing-page
    env:
      CI: true
      KEYCLOAK_HOST: ${{ secrets.KEYCLOAK_HOST }}
      KEYCLOAK_PORT: '28180'
      JWT_ISSUER_URI: http://localhost:28180/realms/slms
      MINIO_HOST: ${{ secrets.MINIO_HOST }}
      MINIO_PORT: '39000'
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: src/frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Add Node to PATH
        run: |
          echo "${{ runner.tool_cache }}/node/20.19.5/x64/bin" >> $GITHUB_PATH
          export PATH="${{ runner.tool_cache }}/node/20.19.5/x64/bin:$PATH"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build health check
        run: npm run build

  admin-console-e2e:
    needs:
      - backend-quality
      - frontend-quality
    runs-on: [self-hosted, slms]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/admin-console/package-lock.json

      - name: Add Node to PATH
        run: |
          echo "${{ runner.tool_cache }}/node/20.19.5/x64/bin" >> $GITHUB_PATH
          export PATH="${{ runner.tool_cache }}/node/20.19.5/x64/bin:$PATH"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Install admin-console dependencies
        working-directory: src/frontend/admin-console
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend/admin-console
        run: npx playwright install --with-deps

      - name: Generate Docker env file from secrets
        run: |
          cat <<EOF > infra/.env
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          MINIO_HOST=minio
          MINIO_PORT=9000
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}

          KEYCLOAK_HOST=keycloak
          KEYCLOAK_PORT=8080
          KEYCLOAK_REALM=${{ secrets.KEYCLOAK_REALM }}
          KEYCLOAK_ADMIN_CLIENT_ID=${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET=${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          JWT_ISSUER_URI=${{ secrets.JWT_ISSUER_URI }}
          KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}

          KC_DB=postgres
          KC_DB_URL=jdbc:postgresql://postgres:5432/${{ secrets.DB_NAME }}
          KC_DB_USERNAME=${{ secrets.DB_USERNAME }}
          KC_DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          KC_HOSTNAME_URL=http://localhost:8180
          KC_HOSTNAME_ADMIN_URL=http://localhost:8180
          KC_HOSTNAME_STRICT=false
          KC_HOSTNAME_STRICT_BACKCHANNEL=false

          SHIPPO_API_KEY=${{ secrets.SHIPPO_API_KEY }}
          SANDBOX_API_KEY=${{ secrets.SANDBOX_API_KEY }}
          SHIPPO_BASE_URL=${{ secrets.SHIPPO_BASE_URL }}
          SHIPENGINE_API_KEY=${{ secrets.SHIPENGINE_API_KEY }}
          SHIPENGINE_BASE_URL=${{ secrets.SHIPENGINE_BASE_URL }}

          NEXT_PUBLIC_FLAGSMITH_ENV_KEY=${{ secrets.NEXT_PUBLIC_FLAGSMITH_ENV_KEY }}
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EOF

      - name: Start SLMS stack
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            up -d --wait --wait-timeout 300

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost/api/actuator/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet, waiting..."
            sleep 5
          done

          echo "Waiting for Keycloak to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:8180/realms/slms > /dev/null 2>&1; then
              echo "Keycloak is ready!"
              break
            fi
            echo "Attempt $i: Keycloak not ready yet, waiting..."
            sleep 5
          done

      - name: Run E2E tests
        working-directory: src/frontend/admin-console
        env:
          E2E_BASE_URL: http://localhost
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-playwright-report
          path: src/frontend/admin-console/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-playwright-results
          path: src/frontend/admin-console/playwright-results
          if-no-files-found: ignore

      - name: Stop SLMS stack
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            down -v
