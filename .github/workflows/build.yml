name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: [self-hosted, slms]
    env:
      KEYCLOAK_HOST: ${{ secrets.KEYCLOAK_HOST }}
      KEYCLOAK_PORT: '28180'
      JWT_ISSUER_URI: http://localhost:28180/realms/slms
      MINIO_HOST: ${{ secrets.MINIO_HOST }}
      MINIO_PORT: '39000'
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Build & Test (with JaCoCo gate)
        id: build
        run: mvn -B -ntp -DskipTests=false -Dtest='!**/*IntegrationTest' clean verify

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d target/allure-results ] && [ "$(ls -A target/allure-results)" ]; then
            mvn -B -ntp allure:report
          else
            echo "No Allure results found; skipping HTML report generation."
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: src/backend/target/allure-results
          if-no-files-found: ignore

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: src/backend/target/site/allure-maven
          if-no-files-found: ignore

      - name: Publish backend JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: src/backend/target/surefire-reports/*.xml
          check_name: Backend Tests
          detailed_summary: true
          fail_on_failure: false

      - name: Upload JaCoCo HTML (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: src/backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Post PR Coverage Gate (always)
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            ${{ steps.build.outcome == 'success'
              && '✅ Quality gate met.'
              || '❌ Quality gate not met (JaCoCo coverage below required threshold).' }}

            _See the uploaded **jacoco-report** artifact for details._

      - name: Enforce gate
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "❌ Quality Gate failed (JaCoCo threshold not reached or build failed)."
            exit 1
          else
            echo " ✅ Quality Gate passed."
          fi

  frontend-quality:
    name: Frontend (${{ matrix.app }})
    runs-on: [self-hosted, slms]
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin-console
          - customer-portal
          - driver-pwa
          - landing-page
    env:
      CI: true
      KEYCLOAK_HOST: ${{ secrets.KEYCLOAK_HOST }}
      KEYCLOAK_PORT: '28180'
      JWT_ISSUER_URI: http://localhost:28180/realms/slms
      MINIO_HOST: ${{ secrets.MINIO_HOST }}
      MINIO_PORT: '39000'
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: src/frontend/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Add Node to PATH
        run: |
          echo "${{ runner.tool_cache }}/node/20.19.5/x64/bin" >> $GITHUB_PATH
          export PATH="${{ runner.tool_cache }}/node/20.19.5/x64/bin:$PATH"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build health check
        run: npm run build

  landing-page-e2e:
    needs:
      - backend-quality
      - frontend-quality
    runs-on: [self-hosted, slms]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/landing-page/package-lock.json

      - name: Add Node to PATH
        run: |
          echo "${{ runner.tool_cache }}/node/20.19.5/x64/bin" >> $GITHUB_PATH
          export PATH="${{ runner.tool_cache }}/node/20.19.5/x64/bin:$PATH"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Install landing page dependencies
        working-directory: src/frontend/landing-page
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend/landing-page
        run: npx playwright install --with-deps

      - name: Start SLMS stack for E2E
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            up -d postgres keycloak minio minio-create-bucket backend admin-console landing-page customer-portal nginx

      - name: Wait for landing page and admin console
        run: |
          timeout 300 bash -c '
            until curl -fsSL http://localhost/ >/dev/null; do
              echo "Waiting for landing page to be ready..."
              sleep 5
            done
            until curl -fsSL http://localhost/admin/ >/dev/null; do
              echo "Waiting for admin console to be ready..."
              sleep 5
            done
          '

      - name: Run Playwright E2E tests
        working-directory: src/frontend/landing-page
        env:
          E2E_BASE_URL: http://localhost
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-playwright-report
          path: src/frontend/landing-page/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-playwright-results
          path: src/frontend/landing-page/playwright-results
          if-no-files-found: ignore

      - name: Stop SLMS stack
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            down -v
