name: Deploy project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: [self-hosted, slms]
    env:
      COMPOSE_PROJECT_NAME: slms-ci-tests
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
      KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM || 'slms' }}
      KC_DB: postgres
      KC_DB_USERNAME: ${{ secrets.DB_USERNAME }}
      KC_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KC_DB_URL: ${{ format('jdbc:postgresql://postgres:5432/{0}', secrets.POSTGRES_DB != '' && secrets.POSTGRES_DB || 'slms') }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Prepare Compose environment
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
          "POSTGRES_DB=${POSTGRES_DB}" \
          "POSTGRES_USER=${POSTGRES_USER}" \
          "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
          "POSTGRES_PORT=5432" \
          "DB_HOST=postgres" \
          "DB_PORT=5432" \
          "DB_NAME=${POSTGRES_DB}" \
          "DB_USERNAME=${KC_DB_USERNAME}" \
          "DB_PASSWORD=${KC_DB_PASSWORD}" \
          "KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}" \
          "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}" \
          "KC_DB=${KC_DB}" \
          "KC_DB_URL=${KC_DB_URL}" \
          "KC_DB_USERNAME=${KC_DB_USERNAME}" \
          "KC_DB_PASSWORD=${KC_DB_PASSWORD}" \
          "KC_HOSTNAME=localhost" \
          "KC_HOSTNAME_PORT=80" \
          "KC_HOSTNAME_STRICT=false" \
          "KC_HTTP_ENABLED=true" \
          "KC_HEALTH_ENABLED=true" \
          "KC_PROXY_HEADERS=xforwarded" \
          "KC_PROXY=edge" \
          "KEYCLOAK_HOST=keycloak" \
          "KEYCLOAK_PORT=8080" \
          "KEYCLOAK_REALM=${KEYCLOAK_REALM}" \
          "KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID}" \
          "KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}" \
          "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
          "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
          "MINIO_BUCKET=${MINIO_BUCKET}" \
          "MINIO_PORT=9000" \
          "MINIO_HOST=minio" \
          > .env.ci
          cp .env.ci .env

      - name: Start integration dependencies
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sudo docker compose --env-file infra/.env.ci -f infra/docker-compose.ci.yml up -d postgres keycloak minio minio-create-bucket

      - name: Wait for Keycloak readiness
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          for attempt in {1..40}; do
            if curl -sSf http://localhost:28180/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          sudo docker compose --env-file infra/.env.ci -f infra/docker-compose.ci.yml logs keycloak
          exit 1

      - name: Debug Keycloak client authentication
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          echo "Testing Keycloak client credentials grant..."
          echo "Realm: ${KEYCLOAK_REALM}"
          echo "Client ID: ${KEYCLOAK_ADMIN_CLIENT_ID}"
          echo "Client secret length: ${#KEYCLOAK_ADMIN_CLIENT_SECRET}"
          
          curl -v -X POST "http://localhost:28180/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${KEYCLOAK_ADMIN_CLIENT_ID}" \
            -d "client_secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}" \
            -d "grant_type=client_credentials" || {
            echo "Failed to authenticate - checking Keycloak logs..."
            sudo docker compose --env-file infra/.env.ci -f infra/docker-compose.ci.yml logs keycloak | tail -100
            exit 1
          }

      - name: Wait for MinIO readiness
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -e
          for attempt in {1..30}; do
            if curl -sSf http://localhost:39000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          sudo docker compose --env-file infra/.env.ci -f infra/docker-compose.ci.yml logs minio
          exit 1

      - name: Run backend integration tests
        working-directory: src/backend
        env:
          KEYCLOAK_HOST: localhost
          KEYCLOAK_PORT: "28180"
          KEYCLOAK_REALM: ${{ env.KEYCLOAK_REALM }}
          KEYCLOAK_ADMIN_CLIENT_ID: ${{ env.KEYCLOAK_ADMIN_CLIENT_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ env.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          MINIO_HOST: localhost
          MINIO_PORT: "39000"
          MINIO_ROOT_USER: ${{ env.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ env.MINIO_ROOT_PASSWORD }}
          MINIO_BUCKET: ${{ env.MINIO_BUCKET }}
        shell: bash
        run: mvn -B -ntp -DskipTests=false -Dtest='*IntegrationTest' test

      - name: Stop integration dependencies
        if: always()
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sudo docker compose --env-file infra/.env.ci -f infra/docker-compose.ci.yml down -v

      - name: Clean CI env file
        if: always()
        working-directory: infra
        shell: bash
        run: rm -f .env.ci

  deploy:
    runs-on: [self-hosted, slms]
    needs: integration-tests
    env:
      COMPOSE_PROJECT_NAME: slms-prod
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      KC_DB: ${{ secrets.KC_DB }}
      KC_DB_URL: ${{ secrets.KC_DB_URL }}
      KC_DB_USERNAME: ${{ secrets.KC_DB_USERNAME }}
      KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
      KC_HOSTNAME: ${{ secrets.KC_HOSTNAME }}
      KC_PROXY: ${{ secrets.KC_PROXY }}
      KC_HOSTNAME_PORT: ${{ secrets.KC_HOSTNAME_PORT }}
      KC_HOSTNAME_STRICT: ${{ secrets.KC_HOSTNAME_STRICT }}
      KC_HTTP_ENABLED: ${{ secrets.KC_HTTP_ENABLED }}
      KC_PROXY_HEADERS: ${{ secrets.KC_PROXY_HEADERS }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      NEXT_TELEMETRY_DISABLED: ${{ secrets.NEXT_TELEMETRY_DISABLED }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MINIO_PORT: ${{ secrets.MINIO_PORT }}
      MINIO_HOST: ${{ secrets.MINIO_HOST }}
      KEYCLOAK_HOST: ${{ secrets.KEYCLOAK_HOST }}
      KEYCLOAK_PORT: ${{ secrets.KEYCLOAK_PORT }}
      KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
      KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      KEYCLOAK_ISSUER: ${{ secrets.KEYCLOAK_ISSUER }}
      KEYCLOAK_BASE_URL: ${{ secrets.KEYCLOAK_BASE_URL }}
      KEYCLOAK_INTERNAL_URL: ${{ secrets.KEYCLOAK_INTERNAL_URL }}
    steps:
      - name: Fix permissions before build
        shell: bash
        run: |
          sudo chown -R $USER:users /home/sousahugo/actions-runner/_work
          sudo chmod -R 777 /home/sousahugo/actions-runner/_work

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env for Compose
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
          "POSTGRES_DB=${POSTGRES_DB}" \
          "POSTGRES_USER=${POSTGRES_USER}" \
          "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
          "POSTGRES_PORT=${POSTGRES_PORT}" \
          "DB_HOST=${DB_HOST}" \
          "DB_PORT=${DB_PORT}" \
          "DB_NAME=${DB_NAME}" \
          "DB_USERNAME=${DB_USERNAME}" \
          "DB_PASSWORD=${DB_PASSWORD}" \
          "KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}" \
          "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}" \
          "KC_DB=${KC_DB}" \
          "KC_DB_URL=${KC_DB_URL}" \
          "KC_DB_USERNAME=${KC_DB_USERNAME}" \
          "KC_DB_PASSWORD=${KC_DB_PASSWORD}" \
          "KC_HOSTNAME=${KC_HOSTNAME}" \
          "KC_HOSTNAME_PORT=${KC_HOSTNAME_PORT}" \
          "KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}" \
          "KC_HTTP_ENABLED=${KC_HTTP_ENABLED}" \
          "KC_PROXY_HEADERS=${KC_PROXY_HEADERS}" \
          "KC_PROXY=${KC_PROXY}" \
          "KEYCLOAK_HOST=${KEYCLOAK_HOST}" \
          "KEYCLOAK_PORT=${KEYCLOAK_PORT}" \
          "KEYCLOAK_REALM=${KEYCLOAK_REALM}" \
          "KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID}" \
          "KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}" \
          "BACKEND_PORT=${BACKEND_PORT}" \
          "FRONTEND_PORT=${FRONTEND_PORT}" \
          "NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}" \
          "NODE_ENV=${NODE_ENV}" \
          "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
          "NEXTAUTH_URL=${NEXTAUTH_URL}" \
          "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
          "KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}" \
          "KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}" \
          "KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}" \
          "KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}" \
          "KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL}" \
          "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
          "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
          "MINIO_BUCKET=${MINIO_BUCKET}" \
          "MINIO_PORT=${MINIO_PORT}" \
          "MINIO_HOST=${MINIO_HOST}" \
          > .env
          head -n 5 .env | sed 's/=.*/=***/'

      - name: Deploy with Docker Compose
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          sudo docker compose --env-file ./.env down --remove-orphans
          sudo docker compose --env-file ./.env up --build -d