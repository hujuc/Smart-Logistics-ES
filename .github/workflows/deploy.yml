name: Deploy project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  deploy:
    runs-on: [self-hosted, slms]   

    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env for Compose
        working-directory: infra
        run: |
          cat > .env <<EOF
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_PORT=$POSTGRES_PORT
          BACKEND_PORT=$BACKEND_PORT
          FRONTEND_PORT=$FRONTEND_PORT
          EOF

      - name: Deploy with Docker Compose
        working-directory: infra
        run: |
          sudo docker compose -f docker-compose.yaml pull || true
          sudo docker compose -f docker-compose.yaml build --pull
          sudo docker compose -f docker-compose.yaml up -d --remove-orphans
          sudo docker compose -f docker-compose.yaml ps
