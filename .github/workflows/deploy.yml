name: Deploy project

on:
  push:
    branches: [ main , 182-304-integrate-terraform-with-cicd-pipeline ]

jobs:
  deploy:
    runs-on: [self-hosted, aws-runner]
    env:
      COMPOSE_PROJECT_NAME: slms-prod
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      KC_DB: ${{ secrets.KC_DB }}
      KC_DB_URL: ${{ secrets.KC_DB_URL }}
      KC_DB_USERNAME: ${{ secrets.KC_DB_USERNAME }}
      KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
      KC_HOSTNAME: ${{ secrets.KC_HOSTNAME }}
      KC_PROXY: ${{ secrets.KC_PROXY }}
      KC_HOSTNAME_PORT: ${{ secrets.KC_HOSTNAME_PORT }}
      KC_HOSTNAME_STRICT: ${{ secrets.KC_HOSTNAME_STRICT }}
      KC_HTTP_ENABLED: ${{ secrets.KC_HTTP_ENABLED }}
      KC_PROXY_HEADERS: ${{ secrets.KC_PROXY_HEADERS }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      NEXT_TELEMETRY_DISABLED: ${{ secrets.NEXT_TELEMETRY_DISABLED }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MINIO_PORT: ${{ secrets.MINIO_PORT }}
      MINIO_HOST: ${{ secrets.MINIO_HOST }}
      KEYCLOAK_HOST: ${{ secrets.KEYCLOAK_HOST }}
      KEYCLOAK_PORT: ${{ secrets.KEYCLOAK_PORT }}
      KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
      KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      KEYCLOAK_ISSUER: ${{ secrets.KEYCLOAK_ISSUER }}
      KEYCLOAK_BASE_URL: ${{ secrets.KEYCLOAK_BASE_URL }}
      KEYCLOAK_INTERNAL_URL: ${{ secrets.KEYCLOAK_INTERNAL_URL }}
      KC_HOSTNAME_URL: ${{ secrets.KC_HOSTNAME_URL }}
      NEXT_PUBLIC_FLAGSMITH_ENV_KEY: ${{ secrets.NEXT_PUBLIC_FLAGSMITH_ENV_KEY }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
      SHIPENGINE_API_KEY: ${{ secrets.SHIPENGINE_API_KEY }}
    steps:
      # - name: Fix permissions before build
      #   shell: bash
      #   run: |
      #     sudo chown -R $USER:users /home/sousahugo/actions-runner/_work
      #     sudo chmod -R 777 /home/sousahugo/actions-runner/_work

      # - name: Allow current user to access Docker daemon
      #   shell: bash
      #   run: |
      #     sudo setfacl -m "user:${USER}:rw" /var/run/docker.sock

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env for Compose
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
          "POSTGRES_DB=${POSTGRES_DB}" \
          "POSTGRES_USER=${POSTGRES_USER}" \
          "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
          "POSTGRES_PORT=${POSTGRES_PORT}" \
          "DB_HOST=${DB_HOST}" \
          "DB_PORT=${DB_PORT}" \
          "DB_NAME=${DB_NAME}" \
          "DB_USERNAME=${DB_USERNAME}" \
          "DB_PASSWORD=${DB_PASSWORD}" \
          "KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}" \
          "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}" \
          "KC_DB=${KC_DB}" \
          "KC_DB_URL=${KC_DB_URL}" \
          "KC_DB_USERNAME=${KC_DB_USERNAME}" \
          "KC_DB_PASSWORD=${KC_DB_PASSWORD}" \
          "KC_HOSTNAME=${KC_HOSTNAME}" \
          "KC_HOSTNAME_PORT=${KC_HOSTNAME_PORT}" \
          "KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}" \
          "KC_HTTP_ENABLED=${KC_HTTP_ENABLED}" \
          "KC_PROXY_HEADERS=${KC_PROXY_HEADERS}" \
          "KC_PROXY=${KC_PROXY}" \
          "KEYCLOAK_HOST=${KEYCLOAK_HOST}" \
          "KEYCLOAK_PORT=${KEYCLOAK_PORT}" \
          "KEYCLOAK_REALM=${KEYCLOAK_REALM}" \
          "KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID}" \
          "KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}" \
          "BACKEND_PORT=${BACKEND_PORT}" \
          "FRONTEND_PORT=${FRONTEND_PORT}" \
          "NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}" \
          "NODE_ENV=${NODE_ENV}" \
          "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
          "NEXTAUTH_URL=${NEXTAUTH_URL}" \
          "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
          "KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}" \
          "KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}" \
          "KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}" \
          "KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}" \
          "KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL}" \
          "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
          "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
          "MINIO_BUCKET=${MINIO_BUCKET}" \
          "MINIO_BUCKET_NAME=${MINIO_BUCKET}" \
          "MINIO_PORT=${MINIO_PORT}" \
          "MINIO_HOST=${MINIO_HOST}" \
          "MAX_BACKUPS=4" \
          "KC_HOSTNAME_URL=${KC_HOSTNAME_URL}" \
          "NEXT_PUBLIC_FLAGSMITH_ENV_KEY=${NEXT_PUBLIC_FLAGSMITH_ENV_KEY}" \
          "NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}" \
          "SHIPPO_API_KEY=${SHIPPO_API_KEY}" \
          "SHIPENGINE_API_KEY=${SHIPENGINE_API_KEY}" \
          "SHIPENGINE_BASE_URL=https://api.shipengine.com/v1" \
          "SHIPPO_BASE_URL=https://api.goshippo.com" \
          > .env
          head -n 5 .env | sed 's/=.*/=***/'

      #- name: Backup database before deployment
      #  if: github.event_name == 'push'
      #  working-directory: infra
      #  shell: bash
      #  run: |
      #    # Check if postgres container exists and is running
      #    if docker ps --format '{{.Names}}' | grep -q '^slms-postgres-prod$'; then
      #      echo "PostgreSQL container found. Checking health..."
#
      #      # Check if postgres is healthy
      #      if docker exec slms-postgres-prod pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} > /dev/null 2>&1; then
      #        echo "PostgreSQL is healthy. Proceeding with backup..."
      #        SHORT_SHA="${GITHUB_SHA:0:7}"
      #        BACKUP_LABEL="pre-${SHORT_SHA}-run${GITHUB_RUN_NUMBER}"
#
      #        sudo docker compose --env-file ./.env up --build -d backup
      #        sudo docker compose --env-file ./.env exec -T \
      #          -e BACKUP_LABEL="$BACKUP_LABEL" \
      #          -e MAX_BACKUPS=4 \
      #          backup /usr/local/bin/backup.sh
#
      #        PRE_BACKUP_FILE=$(sudo docker compose --env-file ./.env exec -T backup sh -c 'ls -t /backups | head -1' | tr -d '\r')
      #        mkdir -p ../backups
      #        sudo docker compose --env-file ./.env cp "backup:/backups/${PRE_BACKUP_FILE}" "../backups/${PRE_BACKUP_FILE}"
      #        echo "PRE_BACKUP_FILE=${PRE_BACKUP_FILE}" >> "$GITHUB_ENV"
      #        echo "✅ Pre-deployment backup completed: ${PRE_BACKUP_FILE}"
      #      else
      #        echo "⚠️  PostgreSQL is not ready. Skipping pre-deployment backup."
      #      fi
      #    else
      #      echo "ℹ️  PostgreSQL container not found. This might be a first deployment - skipping pre-deployment backup."
      #    fi

      - name: Shutdown existing Docker Compose services
        working-directory: infra
        shell: bash
        run: sudo docker compose down --remove-orphans || true

      - name: Remove existing Terraform-managed containers
        shell: bash
        run: sudo docker compose down --remove-orphans || true
          

      - name: Remove existing Terraform-managed containers
        shell: bash
        run: |
          # Stop and remove containers that might conflict with Terraform or docker-compose
          docker stop slms-postgres-prod slms-backend-prod slms-admin-console-prod slms-customer-portal-prod slms-driver-pwa-prod slms-landing-page-prod slms-backup-prod 2>/dev/null || true
          docker rm -f slms-postgres-prod slms-backend-prod slms-admin-console-prod slms-customer-portal-prod slms-driver-pwa-prod slms-landing-page-prod slms-backup-prod 2>/dev/null || true

      - name: Ensure deploy script is executable
        shell: bash
        run: chmod +x infra/deploy.sh

      - name: Deploy infrastructure with Terraform and Docker Compose
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          # Smart deploy: reuses existing containers when possible
          # Rebuild images to include basePath configuration
          ./deploy.sh deploy

      - name: Backup database after deployment
        if: github.event_name == 'push'
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BACKUP_LABEL="post-${SHORT_SHA}-run${GITHUB_RUN_NUMBER}"
          sudo docker compose --env-file ./.env up --build -d backup
          sudo docker compose --env-file ./.env exec -T \
            -e BACKUP_LABEL="$BACKUP_LABEL" \
            -e MAX_BACKUPS=4 \
            backup /usr/local/bin/backup.sh
          POST_BACKUP_FILE=$(sudo docker compose --env-file ./.env exec -T backup sh -c 'ls -t /backups | head -1' | tr -d '\r')
          mkdir -p ../backups
          sudo docker compose --env-file ./.env cp "backup:/backups/${POST_BACKUP_FILE}" "../backups/${POST_BACKUP_FILE}"
          echo "POST_BACKUP_FILE=${POST_BACKUP_FILE}" >> "$GITHUB_ENV"
        env:
          TF_VAR_public_host: ${{ secrets.PUBLIC_HOST || 'ec2-35-181-9-117.eu-west-3.compute.amazonaws.com' }}

      - name: Restart Nginx to refresh container DNS
        shell: bash
        run: |
          # Restart Nginx so it resolves new container IPs after Terraform deploy
          docker restart slms-nginx-prod || true
