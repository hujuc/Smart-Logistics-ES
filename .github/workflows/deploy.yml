  deploy:
    needs:
      - backend-integration
      - admin-console-e2e
      - landing-page-e2e
    runs-on: [self-hosted, aws-runner]
    steps:
      - name: Fix permissions before build
        shell: bash
        run: |
          sudo chown -R $USER:users /home/ubuntu/actions-runner/_work
          sudo chmod -R 777 /home/ubuntu/actions-runner/_work

      # - name: Allow current user to access Docker daemon
      #   shell: bash
      #   run: |
      #     sudo setfacl -m "user:${USER}:rw" /var/run/docker.sock

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env for Compose
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
          "POSTGRES_DB=${POSTGRES_DB}" \
          "POSTGRES_USER=${POSTGRES_USER}" \
          "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
          "POSTGRES_PORT=${POSTGRES_PORT}" \
          "DB_HOST=${DB_HOST}" \
          "DB_PORT=${DB_PORT}" \
          "DB_NAME=${DB_NAME}" \
          "DB_USERNAME=${DB_USERNAME}" \
          "DB_PASSWORD=${DB_PASSWORD}" \
          "JWT_ISSUER_URI=${JWT_ISSUER_URI}" \
          "KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}" \
          "KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}" \
          "KC_DB=${KC_DB}" \
          "KC_DB_URL=${KC_DB_URL}" \
          "KC_DB_USERNAME=${KC_DB_USERNAME}" \
          "KC_DB_PASSWORD=${KC_DB_PASSWORD}" \
          "KC_HOSTNAME=${KC_HOSTNAME}" \
          "KC_HOSTNAME_PORT=${KC_HOSTNAME_PORT}" \
          "KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}" \
          "KC_HTTP_ENABLED=${KC_HTTP_ENABLED}" \
          "KC_PROXY_HEADERS=${KC_PROXY_HEADERS}" \
          "KC_PROXY=${KC_PROXY}" \
          "KEYCLOAK_HOST=${KEYCLOAK_HOST}" \
          "KEYCLOAK_PORT=${KEYCLOAK_PORT}" \
          "KEYCLOAK_REALM=${KEYCLOAK_REALM}" \
          "KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID}" \
          "KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}" \
          "BACKEND_PORT=${BACKEND_PORT}" \
          "FRONTEND_PORT=${FRONTEND_PORT}" \
          "NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}" \
          "NODE_ENV=${NODE_ENV}" \
          "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}" \
          "NEXTAUTH_URL=${NEXTAUTH_URL}" \
          "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
          "KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}" \
          "KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}" \
          "KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}" \
          "KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}" \
          "KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL}" \
          "MINIO_ROOT_USER=${MINIO_ROOT_USER}" \
          "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}" \
          "MINIO_BUCKET=${MINIO_BUCKET}" \
          "MINIO_BUCKET_NAME=${MINIO_BUCKET}" \
          "MINIO_PORT=${MINIO_PORT}" \
          "MINIO_HOST=${MINIO_HOST}" \
          "KC_HOSTNAME_URL=${KC_HOSTNAME_URL}" \
          "NEXT_PUBLIC_FLAGSMITH_ENV_KEY=${NEXT_PUBLIC_FLAGSMITH_ENV_KEY}" \
          "NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}" \
          "SHIPPO_API_KEY=${SHIPPO_API_KEY}" \
          "SHIPENGINE_API_KEY=${SHIPENGINE_API_KEY}" \
          "SHIPENGINE_BASE_URL=https://api.shipengine.com/v1" \
          "SHIPPO_BASE_URL=https://api.goshippo.com" \
          "QR_CONFIRMATION_BASE_URL=${QR_CONFIRMATION_BASE_URL}" \
          "ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL}" \
          "ELASTIC_APM_SECRET_TOKEN=${ELASTIC_APM_SECRET_TOKEN}" \
          "DEPLOYMENT_ENV=${DEPLOYMENT_ENV}" \
          "PROJECT_VERSION=${PROJECT_VERSION}" \
          "TRACING_SAMPLING_RATE=${TRACING_SAMPLING_RATE}" \
          "LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT}" \
          "LOG_LEVEL_APP=${LOG_LEVEL_APP}" \
          "LOG_LEVEL_WEB=${LOG_LEVEL_WEB}" \
          "LOG_LEVEL_SECURITY=${LOG_LEVEL_SECURITY}" \
          > .env
          head -n 5 .env | sed 's/=.*/=***/'

      - name: Write terraform.tfvars
        working-directory: infra/terraform
        shell: bash
        run: |
          cat > terraform.tfvars <<EOF
          # PostgreSQL Configuration
          postgres_user      = "${POSTGRES_USER}"
          postgres_password  = "${POSTGRES_PASSWORD}"
          postgres_db        = "${POSTGRES_DB}"
          postgres_host_port = ${POSTGRES_PORT}

          # Keycloak Configuration
          keycloak_realm               = "${KEYCLOAK_REALM}"
          keycloak_client_id           = "${KEYCLOAK_ADMIN_CLIENT_ID}"
          keycloak_client_secret       = "${KEYCLOAK_ADMIN_CLIENT_SECRET}"
          keycloak_hostname_url        = "${KC_HOSTNAME_URL}"
          keycloak_admin               = "${KEYCLOAK_ADMIN}"
          keycloak_admin_password      = "${KEYCLOAK_ADMIN_PASSWORD}"

          # JWT Configuration
          jwt_issuer_uri      = "${JWT_ISSUER_URI}"

          # MinIO Configuration
          minio_endpoint    = "http://slms-minio-prod:9000"
          minio_access_key  = "${MINIO_ROOT_USER}"
          minio_secret_key  = "${MINIO_ROOT_PASSWORD}"
          minio_bucket_name = "${MINIO_BUCKET}"

          # Shippo API Configuration
          shippo_api_key  = "${SHIPPO_API_KEY}"
          shippo_base_url = "https://api.goshippo.com"

          # ShipEngine API Configuration
          shipengine_api_key  = "${SHIPENGINE_API_KEY}"
          shipengine_base_url = "https://api.shipengine.com/v1"

          # Docker Network
          docker_network_name = "slms-network"

          # Public Host Configuration
          public_host = "${PUBLIC_HOST}"

          # Frontend API URL
          next_public_api_url = "${NEXT_PUBLIC_API_URL}"

          # Frontend Feature Flags
          flagsmith_env_key   = "${NEXT_PUBLIC_FLAGSMITH_ENV_KEY}"
          mapbox_access_token = "${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}"

          # QR Code Configuration
          qr_confirmation_base_url = "${QR_CONFIRMATION_BASE_URL}"

          # Observability - Elastic APM / OpenTelemetry Configuration
          elastic_apm_server_url   = "${ELASTIC_APM_SERVER_URL}"
          elastic_apm_secret_token = "${ELASTIC_APM_SECRET_TOKEN}"
          deployment_env           = "${DEPLOYMENT_ENV}"
          project_version          = "${PROJECT_VERSION}"
          tracing_sampling_rate    = "${TRACING_SAMPLING_RATE}"
          log_level_root           = "${LOG_LEVEL_ROOT}"
          log_level_app            = "${LOG_LEVEL_APP}"
          log_level_web            = "${LOG_LEVEL_WEB}"
          log_level_security       = "${LOG_LEVEL_SECURITY}"
          EOF
          echo "✅ terraform.tfvars created with production secrets"

      - name: Shutdown existing Docker Compose services
        working-directory: infra
        shell: bash
        run: sudo docker compose down --remove-orphans || true

      - name: Remove existing Terraform-managed containers
        shell: bash
        run: sudo docker compose down --remove-orphans || true
          

      - name: Remove existing Terraform-managed containers
        shell: bash
        run: |
          # Stop and remove all replica containers that might conflict with Terraform
          docker ps -a --format '{{.Names}}' | grep -E 'slms-(backend|admin-console|customer-portal|driver-pwa|landing-page|postgres)-prod' | xargs -r docker stop || true
          docker ps -a --format '{{.Names}}' | grep -E 'slms-(backend|admin-console|customer-portal|driver-pwa|landing-page|postgres)-prod' | xargs -r docker rm -f || true

      - name: Ensure deploy script is executable
        shell: bash
        run: chmod +x infra/deploy.sh

      - name: Deploy infrastructure with Terraform and Docker Compose
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          # Smart deploy: reuses existing containers when possible
          # Rebuild images to include basePath configuration
          ./deploy.sh deploy

      - name: Restart Nginx to refresh container DNS
        shell: bash
        run: |
          # Restart Nginx so it resolves new container IPs after Terraform deploy
          docker restart slms-nginx-prod || true
