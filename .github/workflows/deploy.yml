name: Deploy project

on:
  push:
    branches: [ feat/37-cd-pipeline, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to remote VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/slms
            cd ~/slms

            if [ -d ".git" ]; then
              git fetch --prune
              git checkout -f ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }}
              git pull --ff-only origin ${{ github.ref_name }}
            else
              git clone --depth 1 https://github.com/${{ github.repository }} .
              git checkout -f ${{ github.ref_name }} || true
            fi

            cd infra
            cat <<'EOF' > .env
POSTGRES_DB=${{ secrets.POSTGRES_DB }}
POSTGRES_USER=${{ secrets.POSTGRES_USER }}
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
BACKEND_PORT=${{ secrets.BACKEND_PORT }}
FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
EOF

            sudo docker compose -f docker-compose.yaml pull || true
            sudo docker compose -f docker-compose.yaml build --pull
            sudo docker compose -f docker-compose.yaml up -d --remove-orphans
            sudo docker compose -f docker-compose.yaml ps
