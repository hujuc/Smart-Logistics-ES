name: Deploy project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  integration-tests:
    runs-on: [self-hosted, slms]
    env:
      COMPOSE_PROJECT_NAME: slms-ci-tests
      KEYCLOAK_HOST: localhost
      KEYCLOAK_PORT: "28180"
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
      MINIO_HOST: localhost
      MINIO_PORT: "39000"
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: Start integration dependencies
        working-directory: ${{ github.workspace }}
        run: docker compose -f infra/docker-compose.ci.yml up -d postgres keycloak minio minio-create-bucket

      - name: Wait for Keycloak readiness
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..30}; do
            if curl -sSf http://localhost:28180/health/ready > /dev/null; then
              echo "Keycloak is ready for integration tests."
              exit 0
            fi
            echo "Waiting for Keycloak... (attempt ${attempt})"
            sleep 5
          done
          echo "Keycloak did not become ready in time."
          docker compose -f infra/docker-compose.ci.yml logs keycloak
          exit 1

      - name: Wait for MinIO readiness
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in {1..30}; do
            if curl -sSf http://localhost:39000/minio/health/live > /dev/null; then
              echo "MinIO is ready for integration tests."
              exit 0
            fi
            echo "Waiting for MinIO... (attempt ${attempt})"
            sleep 5
          done
          echo "MinIO did not become ready in time."
          docker compose -f infra/docker-compose.ci.yml logs minio
          exit 1

      - name: Run backend integration tests
        working-directory: src/backend
        run: mvn -B -ntp -DskipTests=false -Dtest='*IntegrationTest' test

      - name: Stop integration dependencies
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f infra/docker-compose.ci.yml down -v

  deploy:
    runs-on: [self-hosted, slms]   
    needs: integration-tests

    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      KC_DB: ${{ secrets.KC_DB }}
      KC_DB_URL: ${{ secrets.KC_DB_URL }}
      KC_DB_USERNAME: ${{ secrets.KC_DB_USERNAME }}
      KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
      KC_HOSTNAME: ${{ secrets.KC_HOSTNAME }}
      KC_PROXY: ${{ secrets.KC_PROXY }}
      KC_HOSTNAME_PORT: ${{ secrets.KC_HOSTNAME_PORT }}
      KC_HOSTNAME_STRICT: ${{ secrets.KC_HOSTNAME_STRICT }}
      KC_HTTP_ENABLED: ${{ secrets.KC_HTTP_ENABLED }}
      KC_PROXY_HEADERS: ${{ secrets.KC_PROXY_HEADERS }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT }}
      NEXT_TELEMETRY_DISABLED: ${{ secrets.NEXT_TELEMETRY_DISABLED }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MINIO_PORT: ${{ secrets.MINIO_PORT }}
      MINIO_HOST: ${{ secrets.MINIO_HOST }}
      KEYCLOAK_HOST: ${{ secrets.KEYCLOAK_HOST }}
      KEYCLOAK_PORT: ${{ secrets.KEYCLOAK_PORT }}
      KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
      KEYCLOAK_ADMIN_CLIENT_ID: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      KEYCLOAK_ISSUER: ${{ secrets.KEYCLOAK_ISSUER }}
      KEYCLOAK_BASE_URL: ${{ secrets.KEYCLOAK_BASE_URL }}
      KEYCLOAK_INTERNAL_URL: ${{ secrets.KEYCLOAK_INTERNAL_URL }}

    steps:
      - name: Fix permissions before build
        run: |
          sudo chown -R $USER:users /home/sousahugo/actions-runner/_work
          sudo chmod -R 777 /home/sousahugo/actions-runner/_work
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env for Compose
        working-directory: infra
        run: |
          cat > .env <<EOF
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_PORT=$POSTGRES_PORT
          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_NAME=$DB_NAME
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          KEYCLOAK_ADMIN=$KEYCLOAK_ADMIN
          KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD
          KC_DB=$KC_DB
          KC_DB_URL=$KC_DB_URL
          KC_DB_USERNAME=$KC_DB_USERNAME
          KC_DB_PASSWORD=$KC_DB_PASSWORD
          KC_HOSTNAME=$KC_HOSTNAME
          KC_HOSTNAME_PORT=$KC_HOSTNAME_PORT
          KC_HOSTNAME_STRICT=$KC_HOSTNAME_STRICT
          KC_HTTP_ENABLED=$KC_HTTP_ENABLED
          KC_PROXY_HEADERS=$KC_PROXY_HEADERS
          KC_PROXY=$KC_PROXY
          KEYCLOAK_HOST=$KEYCLOAK_HOST
          KEYCLOAK_PORT=$KEYCLOAK_PORT
          KEYCLOAK_REALM=$KEYCLOAK_REALM
          KEYCLOAK_ADMIN_CLIENT_ID=$KEYCLOAK_ADMIN_CLIENT_ID
          KEYCLOAK_ADMIN_CLIENT_SECRET=$KEYCLOAK_ADMIN_CLIENT_SECRET
          BACKEND_PORT=$BACKEND_PORT
          FRONTEND_PORT=$FRONTEND_PORT
          NEXT_TELEMETRY_DISABLED=$NEXT_TELEMETRY_DISABLED
          NODE_ENV=$NODE_ENV
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          NEXTAUTH_URL=$NEXTAUTH_URL
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          KEYCLOAK_CLIENT_ID=$KEYCLOAK_CLIENT_ID
          KEYCLOAK_CLIENT_SECRET=$KEYCLOAK_CLIENT_SECRET
          KEYCLOAK_ISSUER=$KEYCLOAK_ISSUER
          KEYCLOAK_BASE_URL=$KEYCLOAK_BASE_URL
          KEYCLOAK_INTERNAL_URL=$KEYCLOAK_INTERNAL_URL
          MINIO_ROOT_USER=$MINIO_ROOT_USER
          MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
          MINIO_BUCKET=$MINIO_BUCKET
          MINIO_PORT=$MINIO_PORT
          MINIO_HOST=$MINIO_HOST
          EOF

      - name: Deploy with Docker Compose
        working-directory: infra
        run: |
          sudo docker-compose down --remove-orphans
          sudo docker-compose up --build -d 
