name: CI - Integration & E2E Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: slms-prod
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
  MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
  MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
  KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
  KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
  JWT_ISSUER_URI: ${{ secrets.JWT_ISSUER_URI }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  KAFKA_BROKER_HOST: ${{ secrets.KAFKA_BROKER_HOST || 'kafka' }}
  KAFKA_BROKER_PORT: ${{ secrets.KAFKA_BROKER_PORT || '9092' }}
  KAFKA_BROKER_EXTERNAL_PORT: ${{ secrets.KAFKA_BROKER_EXTERNAL_PORT || '9094' }}
  KAFKA_ADVERTISED_HOST: ${{ secrets.KAFKA_ADVERTISED_HOST || 'localhost' }}
  KAFKA_ZOOKEEPER_HOST: ${{ secrets.KAFKA_ZOOKEEPER_HOST || 'zookeeper' }}
  KAFKA_ZOOKEEPER_PORT: ${{ secrets.KAFKA_ZOOKEEPER_PORT || '2181' }}
  KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS || 'kafka:9092' }}
  KAFKA_CONSUMER_GROUP_ID: ${{ secrets.KAFKA_CONSUMER_GROUP_ID || 'slms-consumers' }}
  KAFKA_CONSUMER_AUTO_OFFSET_RESET: ${{ secrets.KAFKA_CONSUMER_AUTO_OFFSET_RESET || 'earliest' }}
  KAFKA_SECURITY_PROTOCOL: ${{ secrets.KAFKA_SECURITY_PROTOCOL || 'PLAINTEXT' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.0-flash' }}
  GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL || 'text-embedding-004' }}
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
  PINECONE_INDEX: ${{ secrets.PINECONE_INDEX || 'slms-chatbot' }}
  PINECONE_NAMESPACE: ${{ secrets.PINECONE_NAMESPACE || 'en-US' }}

jobs:
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      - name: Setup SLMS environment
        uses: ./.github/actions/setup-slms-env
        with:
          db-host: postgres
          db-port: "5432"
          db-name: ${{ env.DB_NAME }}
          db-username: ${{ env.DB_USERNAME }}
          db-password: ${{ env.DB_PASSWORD }}
          postgres-db: ${{ env.POSTGRES_DB }}
          postgres-user: ${{ env.POSTGRES_USER }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          minio-host: localhost
          minio-port: "39000"
          minio-root-user: ${{ env.MINIO_ROOT_USER }}
          minio-root-password: ${{ env.MINIO_ROOT_PASSWORD }}
          minio-bucket: ${{ env.MINIO_BUCKET }}
          kafka-broker-host: ${{ env.KAFKA_BROKER_HOST }}
          kafka-broker-port: ${{ env.KAFKA_BROKER_PORT }}
          kafka-broker-external-port: ${{ env.KAFKA_BROKER_EXTERNAL_PORT }}
          kafka-advertised-host: ${{ env.KAFKA_ADVERTISED_HOST }}
          kafka-zookeeper-host: ${{ env.KAFKA_ZOOKEEPER_HOST }}
          kafka-zookeeper-port: ${{ env.KAFKA_ZOOKEEPER_PORT }}
          kafka-bootstrap-servers: ${{ env.KAFKA_BOOTSTRAP_SERVERS }}
          kafka-consumer-group-id: ${{ env.KAFKA_CONSUMER_GROUP_ID }}
          kafka-consumer-auto-offset-reset: ${{ env.KAFKA_CONSUMER_AUTO_OFFSET_RESET }}
          kafka-security-protocol: ${{ env.KAFKA_SECURITY_PROTOCOL }}
          keycloak-host: localhost
          keycloak-port: "28180"
          keycloak-admin-client-secret: ${{ env.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          jwt-issuer-uri: http://localhost:28180/realms/slms
          keycloak-admin: ${{ env.KEYCLOAK_ADMIN }}
          keycloak-admin-password: ${{ env.KEYCLOAK_ADMIN_PASSWORD }}
          nextauth-secret: ${{ env.NEXTAUTH_SECRET }}
          gemini-api-key: ${{ env.GEMINI_API_KEY }}
          gemini-model: ${{ env.GEMINI_MODEL }}
          gemini-embedding-model: ${{ env.GEMINI_EMBEDDING_MODEL }}
          pinecone-api-key: ${{ env.PINECONE_API_KEY }}
          pinecone-host: ${{ env.PINECONE_HOST }}
          pinecone-index: ${{ env.PINECONE_INDEX }}
          pinecone-namespace: ${{ env.PINECONE_NAMESPACE }}

      - name: Cleanup existing containers
        run: |
          docker compose -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml down --remove-orphans || true
          docker system prune -f --volumes || true

      - name: Start test dependencies
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            up -d postgres keycloak minio minio-create-bucket zookeeper kafka

      - name: Wait for services
        run: |
          set -e
          COMPOSE_FILES="-f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml"

          echo "Checking service health status..."

          # Function to wait for service health
          wait_for_health() {
            local service=$1
            local timeout=$2
            local elapsed=0

            echo "Waiting for $service to be healthy (timeout: ${timeout}s)..."
            while [ $elapsed -lt $timeout ]; do
              # Handle both array and object JSON formats from docker compose ps
              health_status=$(docker compose $COMPOSE_FILES ps --format json $service 2>/dev/null | jq -r 'if type=="array" then (if length > 0 then .[0].Health else "unknown" end) else .Health end // "unknown"')

              # If health status is unavailable, check container state
              if [ "$health_status" = "unknown" ] || [ "$health_status" = "null" ]; then
                container_state=$(docker compose $COMPOSE_FILES ps --format json $service 2>/dev/null | jq -r 'if type=="array" then (if length > 0 then .[0].State else "unknown" end) else .State end // "unknown"')
                if [ "$container_state" = "running" ]; then
                  health_status="running (no healthcheck)"
                else
                  health_status="$container_state"
                fi
              fi

              if [ "$health_status" = "healthy" ]; then
                echo "$service is healthy!"
                return 0
              fi

              echo "   Status: $health_status (${elapsed}s elapsed)"
              sleep 5
              elapsed=$((elapsed + 5))
            done

            echo "$service failed to become healthy within ${timeout}s"
            echo "Service logs:"
            docker compose $COMPOSE_FILES logs --tail=50 $service
            echo "Container status:"
            docker compose $COMPOSE_FILES ps $service
            return 1
          }

          # Wait for each service with appropriate timeouts
          wait_for_health "postgres" 90
          wait_for_health "keycloak" 240
          wait_for_health "zookeeper" 60
          wait_for_health "minio" 90
          wait_for_health "kafka" 120

          echo "All services are healthy!"
          echo "Waiting additional 10 seconds for stability..."
          sleep 10

      - name: Run backend integration tests
        working-directory: src/backend
        run: cd ../../ && make test-backend-integration
        env:
          KEYCLOAK_HOST: localhost
          KEYCLOAK_PORT: "28180"
          MINIO_HOST: localhost
          MINIO_PORT: "39000"
          KAFKA_BOOTSTRAP_SERVERS: localhost:39092

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: src/backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            down -v

  # E2E tests - debugging authentication issues with detailed logging
  e2e-tests:
    name: E2E Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [admin-console, customer-portal, driver-pwa, landing-page]

    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Install ${{ matrix.app }} dependencies
        working-directory: src/frontend/${{ matrix.app }}
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend/${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Setup SLMS environment
        uses: ./.github/actions/setup-slms-env
        with:
          db-host: postgres
          db-port: "5432"
          db-name: ${{ env.DB_NAME }}
          db-username: ${{ env.DB_USERNAME }}
          db-password: ${{ env.DB_PASSWORD }}
          postgres-db: ${{ env.POSTGRES_DB }}
          postgres-user: ${{ env.POSTGRES_USER }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          minio-host: minio
          minio-port: "9000"
          minio-root-user: ${{ env.MINIO_ROOT_USER }}
          minio-root-password: ${{ env.MINIO_ROOT_PASSWORD }}
          minio-bucket: ${{ env.MINIO_BUCKET }}
          kafka-broker-host: ${{ env.KAFKA_BROKER_HOST }}
          kafka-broker-port: ${{ env.KAFKA_BROKER_PORT }}
          kafka-broker-external-port: ${{ env.KAFKA_BROKER_EXTERNAL_PORT }}
          kafka-advertised-host: ${{ env.KAFKA_ADVERTISED_HOST }}
          kafka-zookeeper-host: ${{ env.KAFKA_ZOOKEEPER_HOST }}
          kafka-zookeeper-port: ${{ env.KAFKA_ZOOKEEPER_PORT }}
          kafka-bootstrap-servers: ${{ env.KAFKA_BOOTSTRAP_SERVERS }}
          kafka-consumer-group-id: ${{ env.KAFKA_CONSUMER_GROUP_ID }}
          kafka-consumer-auto-offset-reset: ${{ env.KAFKA_CONSUMER_AUTO_OFFSET_RESET }}
          kafka-security-protocol: ${{ env.KAFKA_SECURITY_PROTOCOL }}
          keycloak-host: keycloak
          keycloak-port: "8080"
          keycloak-admin-client-secret: ${{ env.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          jwt-issuer-uri: ${{ env.JWT_ISSUER_URI }}
          keycloak-admin: ${{ env.KEYCLOAK_ADMIN }}
          keycloak-admin-password: ${{ env.KEYCLOAK_ADMIN_PASSWORD }}
          nextauth-secret: ${{ env.NEXTAUTH_SECRET }}
          gemini-api-key: ${{ env.GEMINI_API_KEY }}
          gemini-model: ${{ env.GEMINI_MODEL }}
          gemini-embedding-model: ${{ env.GEMINI_EMBEDDING_MODEL }}
          pinecone-api-key: ${{ env.PINECONE_API_KEY }}
          pinecone-host: ${{ env.PINECONE_HOST }}
          pinecone-index: ${{ env.PINECONE_INDEX }}
          pinecone-namespace: ${{ env.PINECONE_NAMESPACE }}

      - name: Cleanup existing containers
        run: |
          docker compose -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml down --remove-orphans || true
          docker system prune -f --volumes || true

      - name: Build services for E2E (to avoid timeout during startup)
        run: |
          echo "Building backend and frontend services..."
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            build backend admin-console landing-page customer-portal
          echo "Build completed!"

      - name: Start SLMS stack for E2E
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            up -d postgres keycloak minio minio-create-bucket backend admin-console landing-page customer-portal nginx

      - name: Wait for services to be ready
        run: |
          set -e
          COMPOSE_FILES="-f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml"

          echo "Waiting for services to be ready for E2E tests..."

          # Wait for Keycloak
          echo "Waiting for Keycloak..."
          timeout 180 bash -c 'until curl -f http://localhost:28180/realms/slms 2>/dev/null | grep -q "realm"; do sleep 3; done'
          echo "Keycloak is ready!"

          # Wait for Backend - CRITICAL with extended timeout
          echo "Waiting for Backend API..."
          echo "Note: Backend needs to compile and start Spring Boot, this may take several minutes..."

          # First check if backend container is running
          backend_state=$(docker compose $COMPOSE_FILES ps --format json backend 2>/dev/null | jq -r 'if type=="array" then (if length > 0 then .[0].State else "unknown" end) else .State end // "unknown"')
          echo "Backend container state: $backend_state"

          if [ "$backend_state" != "running" ]; then
            echo "ERROR: Backend container is not running!"
            echo "Backend container logs:"
            docker compose $COMPOSE_FILES logs --tail=100 backend
            exit 1
          fi

          # Now wait for backend health endpoint (increased timeout for Maven build)
          backend_ready=false
          for i in {1..36}; do  # 36 * 5s = 180s = 3 minutes
            if curl -f http://localhost/actuator/health 2>/dev/null | grep -q "UP"; then
              echo "Backend API is healthy! (attempt $i)"
              backend_ready=true
              break
            fi
            echo "Backend not ready yet... (attempt $i/36, elapsed: $((i * 5))s)"
            sleep 5
          done

          if [ "$backend_ready" = false ]; then
            echo "ERROR: Backend failed to become ready within 3 minutes"
            echo "Backend logs:"
            docker compose $COMPOSE_FILES logs --tail=200 backend
            exit 1
          fi

          # Additional stability wait
          echo "Waiting 20 seconds for backend to fully stabilize..."
          sleep 20

          # Wait for Landing Page
          echo "Waiting for Landing Page..."
          timeout 300 bash -c 'until curl -fsSL http://localhost/ > /dev/null; do sleep 5; done'
          echo "Landing Page is ready!"

          # Wait for Admin Console
          echo "Waiting for Admin Console..."
          timeout 300 bash -c 'until curl -fsSL http://localhost/admin/ > /dev/null; do sleep 5; done'
          echo "Admin Console is ready!"

          echo "All services are ready for E2E tests!"

      - name: Run E2E tests for ${{ matrix.app }}
        working-directory: src/frontend/${{ matrix.app }}
        env:
          E2E_BASE_URL: http://localhost
        run: |
          if npm run | grep -q "test:e2e"; then
            npm run test:e2e
          else
            echo "⚠️ No test:e2e script found for ${{ matrix.app }}, skipping..."
            exit 0
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-playwright-report
          path: src/frontend/${{ matrix.app }}/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-playwright-results
          path: src/frontend/${{ matrix.app }}/playwright-results
          if-no-files-found: ignore

      - name: Stop SLMS stack
        if: always()
        run: |
          docker compose \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.ci.yml \
            down -v
