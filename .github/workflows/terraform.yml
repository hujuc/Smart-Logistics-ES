name: Terraform Infrastructure

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infra/terraform/**'

env:
  TF_VERSION: '1.5'
  WORKING_DIR: './infra/terraform'

jobs:
  terraform:
    name: 'Terraform Plan & Apply'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          # PostgreSQL Configuration
          postgres_user      = "${{ secrets.POSTGRES_USER }}"
          postgres_password  = "${{ secrets.POSTGRES_PASSWORD }}"
          postgres_db        = "${{ secrets.POSTGRES_DB }}"
          postgres_host_port = ${{ secrets.POSTGRES_PORT }}

          # Keycloak Configuration
          keycloak_realm               = "${{ secrets.KEYCLOAK_REALM }}"
          keycloak_client_id           = "${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}"
          keycloak_client_secret       = "${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}"
          keycloak_hostname_url        = "${{ secrets.KC_HOSTNAME_URL }}"
          keycloak_admin               = "${{ secrets.KEYCLOAK_ADMIN }}"
          keycloak_admin_password      = "${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}"

          # JWT Configuration
          jwt_issuer_uri      = "${{ secrets.KC_HOSTNAME_URL }}/realms/${{ secrets.KEYCLOAK_REALM }}"

          # MinIO Configuration
          minio_endpoint    = "http://slms-minio-prod:9000"
          minio_access_key  = "${{ secrets.MINIO_ROOT_USER }}"
          minio_secret_key  = "${{ secrets.MINIO_ROOT_PASSWORD }}"
          minio_bucket_name = "${{ secrets.MINIO_BUCKET }}"

          # Shippo API Configuration
          shippo_api_key  = "${{ secrets.SHIPPO_API_KEY }}"
          shippo_base_url = "https://api.goshippo.com"

          # ShipEngine API Configuration
          shipengine_api_key  = "${{ secrets.SHIPENGINE_API_KEY }}"
          shipengine_base_url = "https://api.shipengine.com/v1"

          # Docker Network
          docker_network_name = "slms-network"

          # Public Host Configuration
          public_host = "${{ secrets.PUBLIC_HOST || 'ec2-35-181-9-117.eu-west-3.compute.amazonaws.com' }}"

          # Frontend API URL
          next_public_api_url = "${{ secrets.NEXT_PUBLIC_API_URL }}"

          # Frontend Feature Flags
          flagsmith_env_key   = "${{ secrets.NEXT_PUBLIC_FLAGSMITH_ENV_KEY }}"
          mapbox_access_token = "${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}"
          EOF
          echo "✅ terraform.tfvars created"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Init
        id: init
        run: terraform init
      
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -input=false

      - name: Fail if Terraform Plan Failed
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        run: |
          echo "❌ Terraform plan failed!"
          exit 1

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
              
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
